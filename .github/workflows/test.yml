name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  window:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: window
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # actions/checkout v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # actions/setup-node v4.4.0
        with:
          node-version: 24
      - run: npm test

  qml:
    runs-on: ubuntu-latest
    # qmllint resolves Quickshell's imports, which Arch packages. Arch's own
    # registry, not Docker Hub, whose anonymous pull limit failed the job.
    # The first step runs pacman -Syu, so the branch tag's age does not matter.
    container: registry.archlinux.org/archlinux/archlinux-docker:base-master
    defaults:
      run:
        working-directory: window
    steps:
      - run: pacman -Syu --noconfirm --needed qt6-declarative qt6-websockets quickshell nodejs npm
        working-directory: /
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # actions/checkout v4.4.0
      - run: npm run lint:qml

  sync:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sync
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # actions/checkout v4.4.0
      - uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # gradle/actions v6.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # actions/setup-java v4.9.1
        with:
          distribution: temurin
          java-version: 21
      # v6 caches through a proprietary component under separate terms, so setup-gradle stays on v4.
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # gradle/actions v4.4.4
      - run: ./gradlew test
