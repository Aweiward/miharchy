name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  window:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: window
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm test

  qml:
    runs-on: ubuntu-latest
    # qmllint resolves Quickshell's imports, which Arch packages.
    container: archlinux:latest
    defaults:
      run:
        working-directory: window
    steps:
      - run: pacman -Syu --noconfirm --needed qt6-declarative qt6-websockets quickshell nodejs npm
        working-directory: /
      - uses: actions/checkout@v4
      - run: npm run lint:qml

  sync:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sync
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew test
